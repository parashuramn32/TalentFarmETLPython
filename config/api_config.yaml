# Online Sales API (backend service on port 5001)
#
# The lab API (api_app/app.py) returns a plain JSON array, ignores page and
# page_size, and implements no authentication. The connector handles both an
# envelope response and a plain array, and only sends the X-API-Key header
# when a real key is configured. Set api_key to 'not-required' when the API
# has no authentication.
online_sales_api:
  base_url: ${API_BASE_URL}          # e.g. http://127.0.0.1:5001/api
  endpoint: /online-sales
  health_endpoint: /health
  api_key: ${API_KEY}
  page_size: 500
  timeout_seconds: 60                # the endpoint returns the full range in one call
  max_retries: 3
  backoff_seconds: 5
  max_pages: 200                     # safety stop so a broken API cannot loop forever
