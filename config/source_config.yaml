# Source objects and load filters - verified against 02CreateTables.sql
# Status column is 'transaction_status' in every source and staging table.
retail:
  file_path: ${RETAIL_CSV_PATH}
  source_db: source_retail
  source_table: retail_sales_raw
  staging_table: stg_retail_sales
  status_column: transaction_status
  status_filter: [COMPLETED]
  excluded_status: [CANCELLED]
  primary_key: transaction_id            # same name in source and staging (no rename)
  mandatory_fields: [transaction_id, sale_date, branch_code, customer_id, product_code, gross_amount]
  compare_columns: [sale_date, branch_code, customer_id, product_code, product_name_raw,
                    product_type_raw, gross_amount, discount_amount, payment_mode]
  expected_columns:
    - transaction_id
    - sale_date
    - branch_code
    - customer_id
    - product_code
    - product_name_raw
    - product_type_raw
    - policy_number
    - folio_number
    - gross_amount
    - discount_amount
    - transaction_status
    - salesperson_id
    - payment_mode
    - created_at

distributor:
  source_db: source_distributor
  source_table: distributor_sales_raw
  staging_table: stg_distributor_sales
  status_column: transaction_status
  status_filter: [APPROVED]
  excluded_status: [SUBMITTED, REJECTED, CANCELLED]
  primary_key_source: distributor_txn_id   # renamed on load
  primary_key_target: transaction_id
  mandatory_fields: [transaction_id, sale_date, distributor_code, product_code, gross_amount]
  compare_columns: [sale_date, distributor_code, customer_id, product_code, product_name_raw,
                    product_type_raw, gross_amount, discount_amount, commission_amount, region_code]

online:
  source_db: source_online
  source_table: online_sales_raw
  staging_table: stg_online_sales
  status_column: transaction_status
  status_filter: [COMPLETED]
  excluded_status: [PENDING, FAILED]
  primary_key: transaction_id
  mandatory_fields: [transaction_id, sale_date, customer_id, product_code, gross_amount]
  compare_columns: [sale_date, customer_id, product_code, product_name_raw,
                    product_type_raw, gross_amount, discount_amount, region_code, payment_mode]

# All master / reference tables live in fs_source_retail
master:
  customer:
    source_db: source_retail
    source_table: customer_master_raw
    staging_table: stg_customer_master
    key: customer_id
  product:
    source_db: source_retail
    source_table: product_master_raw
    staging_table: stg_product_master
    key: product_code
  branch_region:
    source_db: source_retail
    source_table: branch_region_mapping_raw
    staging_table: stg_branch_region_mapping
    key: branch_code

datamart:
  transaction_table: dm_sales_transaction
  primary_key: sales_transaction_id
  summaries:
    daily:     dm_sales_daily_summary
    channel:   dm_sales_channel_summary
    region:    dm_sales_region_summary
    product:   dm_sales_product_summary
    executive: dm_executive_sales_summary
